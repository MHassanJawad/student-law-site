# Quality gate for the web app, ingestion worker, and SQL migrations.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Validate local migrations
        run: |
          npx supabase start
          npx supabase db reset --local
          npx supabase db lint --local
      - name: Check search, accounts, editorial isolation, and import failure
        run: bash scripts/ci-verify-local.sh
      - name: Rehearse corpus backup and restore
        run: bash scripts/ci-restore-drill.sh
