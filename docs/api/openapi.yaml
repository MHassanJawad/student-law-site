openapi: 3.0.3
info:
  title: Student Law Site API
  version: 0.1.0
  description: Public research reads expose published, approved, source-traceable records only. Private account operations use a validated Supabase bearer session.
servers:
  - url: /api/v1
tags:
  - name: Search
  - name: Documents
  - name: Editorial
  - name: Account
  - name: Coverage
paths:
  /search/research:
    get:
      tags: [Search]
      summary: Search reviewed judgments or legislation by collection mode
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [case-law, courtwise, citation, advanced, statutes], default: case-law}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: author, in: query, schema: {type: string, maxLength: 100}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: reporter, in: query, schema: {type: string, maxLength: 30}}
        - {name: citationYear, in: query, schema: {type: integer, minimum: 1800, maximum: 2200}}
        - {name: citationPage, in: query, schema: {type: string, maxLength: 30}}
        - {name: jurisdiction, in: query, schema: {type: string}}
        - {name: year, in: query, schema: {type: integer, minimum: 1800, maximum: 2200}}
        - {name: instrumentType, in: query, schema: {type: string, maxLength: 80}}
        - {name: legalStatus, in: query, schema: {type: string, enum: [in_force, repealed, partly_in_force, unknown]}}
        - {name: sort, in: query, schema: {type: string, enum: [relevance, decision-newest, decision-oldest, title]}}
        - $ref: '#/components/parameters/Page'
      responses:
        '200': {description: Published approved results with measured coverage and Cache-Control no-store, content: {application/json: {schema: {$ref: '#/components/schemas/SearchPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /search/judgments:
    get:
      tags: [Search]
      summary: Search FCCP judgments only
      parameters:
        - $ref: '#/components/parameters/Query'
        - {name: citation, in: query, schema: {type: string, maxLength: 200}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: bench, in: query, schema: {type: string}}
        - {name: caseType, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: FCCP results with coverage, content: {application/json: {schema: {$ref: '#/components/schemas/SearchPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /search/legislation:
    get:
      tags: [Search]
      summary: Search covered federal and provincial laws
      parameters:
        - $ref: '#/components/parameters/Query'
        - {name: jurisdiction, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: year, in: query, schema: {type: integer, minimum: 1800}}
        - {name: status, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: Law results with coverage, content: {application/json: {schema: {$ref: '#/components/schemas/SearchPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /search/citations:
    get:
      tags: [Search]
      summary: Resolve exact or partial FCCP citation by text or reporter/year/page fields
      parameters:
        - {name: q, in: query, schema: {type: string, minLength: 2, maxLength: 200}}
        - {name: reporter, in: query, schema: {type: string, maxLength: 30}}
        - {name: year, in: query, schema: {type: integer, minimum: 1800}}
        - {name: page, in: query, schema: {type: string, maxLength: 30}}
        - $ref: '#/components/parameters/Page'
      responses:
        '200': {description: Candidate matches; ambiguous true when more than one plausible document, content: {application/json: {schema: {$ref: '#/components/schemas/CitationResults'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /documents/{id}:
    get:
      tags: [Documents]
      summary: Published legal document and current published version
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Document detail, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /documents/{id}/sections:
    get:
      tags: [Documents]
      summary: Validated sections of a published version
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Ordered sections, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Section'}}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /editorial/{kind}:
    get:
      tags: [Editorial]
      summary: List published editorial entries
      parameters:
        - $ref: '#/components/parameters/EditorialKind'
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - $ref: '#/components/parameters/Page'
      responses:
        '200': {description: Published entries, content: {application/json: {schema: {type: object, required: [items, page, total], properties: {items: {type: array, items: {$ref: '#/components/schemas/EditorialSummary'}}, page: {type: integer}, total: {type: integer}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /editorial/{kind}/{slug}:
    get:
      tags: [Editorial]
      summary: Published editorial entry
      parameters:
        - $ref: '#/components/parameters/EditorialKind'
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Entry detail, content: {application/json: {schema: {$ref: '#/components/schemas/EditorialEntry'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /coverage:
    get:
      tags: [Coverage]
      summary: Measured source coverage and checked dates
      responses:
        '200': {description: Coverage entries, content: {application/json: {schema: {type: object, required: [sources], properties: {sources: {type: array, items: {$ref: '#/components/schemas/Coverage'}}}}}}}
  /me/saved-citations:
    get:
      tags: [Account]
      security: [{bearerAuth: []}]
      summary: List up to 500 newest own saved citations
      responses:
        '200': {description: Newest 500 own citations with full count, content: {application/json: {schema: {type: object, required: [items, page, total], properties: {items: {type: array, items: {$ref: '#/components/schemas/SavedCitation'}}, page: {type: integer}, total: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Account]
      security: [{bearerAuth: []}]
      summary: Save a published document citation once
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [documentId], properties: {documentId: {type: string, format: uuid}}}}}
      responses:
        '201': {description: Citation saved, content: {application/json: {schema: {$ref: '#/components/schemas/SavedCitation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me/saved-citations/{id}:
    patch:
      tags: [Account]
      security: [{bearerAuth: []}]
      summary: Update own saved citation note/folder
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {note: {type: string, maxLength: 2000, nullable: true}, folder: {type: string, maxLength: 80, nullable: true}}, minProperties: 1}}}
      responses:
        '200': {description: Updated saved citation, content: {application/json: {schema: {$ref: '#/components/schemas/SavedCitation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Account]
      security: [{bearerAuth: []}]
      summary: Remove own saved citation
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/export:
    get:
      tags: [Account]
      security: [{bearerAuth: []}]
      summary: Download own saved citations as JSON
      responses:
        '200': {description: Owner-only JSON export with format, exportedAt, and items}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/account:
    delete:
      tags: [Account]
      security: [{bearerAuth: []}]
      summary: Permanently delete own account after password verification
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [confirmation, password], properties: {confirmation: {type: string, enum: [DELETE]}, password: {type: string}}}}}
      responses:
        '204': {description: Account and personal saved citations deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Current password incorrect}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Query: {name: q, in: query, schema: {type: string, maxLength: 500}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    EditorialKind: {name: kind, in: path, required: true, schema: {type: string, enum: [maxims, articles, dictionary]}}
  responses:
    BadRequest: {description: Invalid input, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Missing or invalid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: No visible resource, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Duplicate saved citation, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RateLimited: {description: Rate limit reached, headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties: {code: {type: string}, message: {type: string}, requestId: {type: string}}
    SearchPage:
      type: object
      required: [items, page, limit, total, coverage]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SearchHit'}}
        page: {type: integer}
        limit: {type: integer}
        total: {type: integer}
        coverage: {type: array, items: {$ref: '#/components/schemas/Coverage'}}
    SearchHit:
      type: object
      required: [id, kind, title, sourceUrl]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [judgment, legislation]}
        title: {type: string}
        caseNumber: {type: string, nullable: true}
        citation: {type: string, nullable: true}
        date: {type: string, format: date, nullable: true}
        excerpt: {type: string, nullable: true}
        sourceUrl: {type: string, format: uri}
        checkedAt: {type: string, format: date-time, nullable: true}
        sourceCode: {type: string}
        sourceName: {type: string}
        versionId: {type: string, format: uuid}
        court: {type: string, nullable: true}
        jurisdiction: {type: string, nullable: true}
        instrumentType: {type: string, nullable: true}
        enactmentYear: {type: integer, nullable: true}
        legalStatus: {type: string, nullable: true}
    CitationResults:
      type: object
      required: [items, ambiguous]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SearchHit'}}
        ambiguous: {type: boolean}
    Document:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          required: [versionId, textKind]
          properties:
            versionId: {type: string, format: uuid}
            text: {type: string, nullable: true}
            textKind: {type: string, enum: [source, extracted, ocr, none]}
            versionLabel: {type: string, nullable: true}
            sourceStatus: {type: string, nullable: true}
            metadata: {type: object, additionalProperties: true}
            source: {type: object, additionalProperties: true}
            sections: {type: array, items: {$ref: '#/components/schemas/Section'}}
    Section:
      type: object
      required: [key, order, body]
      properties: {key: {type: string}, order: {type: integer}, heading: {type: string, nullable: true}, body: {type: string}}
    EditorialSummary:
      type: object
      required: [slug, title, summary, author, published_at]
      properties: {slug: {type: string}, title: {type: string}, summary: {type: string}, author: {type: string}, topic: {type: string, nullable: true}, source_url: {type: string, format: uri, nullable: true}, published_at: {type: string, format: date-time}}
    EditorialEntry:
      type: object
      required: [kind, slug, title, summary, body, author, provenance_note, reviewed_at, published_at]
      properties: {kind: {type: string}, slug: {type: string}, title: {type: string}, summary: {type: string}, body: {type: string}, author: {type: string}, topic: {type: string, nullable: true}, source_url: {type: string, format: uri, nullable: true}, provenance_note: {type: string}, reviewed_at: {type: string, format: date-time}, published_at: {type: string, format: date-time}}
    SavedCitation:
      type: object
      required: [id, document_id, citation_snapshot, created_at, updated_at]
      properties: {id: {type: string, format: uuid}, document_id: {type: string, format: uuid}, citation_snapshot: {type: string}, note: {type: string, nullable: true}, folder: {type: string, nullable: true}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    Coverage:
      type: object
      required: [sourceCode, kind, jurisdiction, count]
      properties: {sourceCode: {type: string}, kind: {type: string}, jurisdiction: {type: string}, count: {type: integer}, lastCheckedAt: {type: string, format: date-time, nullable: true}}
